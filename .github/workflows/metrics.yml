name: Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Each step is independent: one failing does not block the others.
      # The `user:` field is set explicitly in all three steps.

      - name: 3D contribution calendar
        uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Maazitm
          template: classic
          base: ""
          filename: assets/metrics.isometric.svg
          config_timezone: Asia/Kolkata
          plugin_isometric: yes
          plugin_isometric_duration: 365

      - name: Language mix
        if: ${{ success() || failure() }}
        uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Maazitm
          template: classic
          base: ""
          filename: assets/metrics.languages.svg
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, shell, makefile, c++, cmake, swift, ruby, objective-c

      - name: Achievements
        if: ${{ success() || failure() }}
        uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Maazitm
          template: classic
          base: ""
          filename: assets/metrics.achievements.svg
          config_timezone: Asia/Kolkata
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
